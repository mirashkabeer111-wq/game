<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#080d1b">

<style>

*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#17335a 0,var(--bg) 55%);color:#eef6ff;font-family:system-ui,Arial,sans-serif}
header,main,#gameView{width:min(1120px,calc(100% - 28px));margin:auto}header{padding:26px 0 18px}h1{font-size:clamp(30px,6vw,48px);margin:0;letter-spacing:-1px}h1 span{color:var(--cyan)}p{color:var(--muted)}

.stage{background:#101c32;border:1px solid var(--line);border-radius:18px;padding:12px}#title{margin:0 0 8px;font-size:22px}canvas{width:100%;height:auto;display:block;aspect-ratio:8/5;background:#071020;border:1px solid #2a4161;border-radius:12px;touch-action:none}

</style>
</head>
<body>
<header id="header">
<h1>🎮 30 <span>GAMES HUB</span></h1>
<p>30 mini-games in one HTML file · Mobile + PC controls · No external game links</p>
<div class="tools"><input id="search" placeholder="🔎 Search games"><select id="filter"><option>All</option><option>Arcade</option><option>Action</option><option>Puzzle</option><option>Sports</option><option>Racing</option></select></div>
</header>
<main id="menu"><div class="grid" id="grid"></div></main>
<section id="gameView">
<div class="top"><button class="btn" id="back">← All games</button><strong id="score">Score: 0</strong><button class="btn" id="reset">↻ Restart</button></div>
<div class="stage"><h2 id="title"></h2><canvas id="screen" width="800" height="500"></canvas><p id="hint"></p><div class="pad">
<button class="btn" data-key="ArrowLeft">◀</button><button class="btn" data-key="ArrowUp">▲</button><button class="btn" data-key="ArrowDown">▼</button><button class="btn" data-key="ArrowRight">▶</button><button class="btn primary" data-key=" ">●</button>
</div></div>
</section>
<div id="result"><div class="dialog"><h2 id="resultTitle">Game over</h2><p id="resultText"></p><button class="btn primary" id="retry">Play again</button> <button class="btn" id="resultMenu">Menu</button></div></div>
<footer>30 Games Hub · HTML, CSS and JavaScript · Best scores saved on this device</footer>
<script>

const $=s=>document.querySelector(s),grid=$("#grid"),canvas=$("#screen"),ctx=canvas.getContext("2d");
games.forEach((g,i)=>{let b=document.createElement("button");b.className="card";b.innerHTML=`<span class="emoji">${g[1]}</span><b>${i+1}. ${g[0]}</b><small>${g[2]}</small>`;b.onclick=()=>start(i);b.dataset.cat=g[2];b.dataset.name=g[0].toLowerCase();grid.append(b)});

function initGame(){let s=state;

if(game===9){s.board=Array(16).fill(0);spawn2048();spawn2048()}

}
function spawn2048(){let a=state.board.map((v,i)=>v? -1:i).filter(i=>i>=0);if(a.length)state.board[a[Math.floor(Math.random()*a.length)]]=Math.random()<.9?2:4}

$("#back").onclick=menu;$("#resultMenu").onclick=menu;$("#reset").onclick=()=>start(game);$("#retry").onclick=()=>start(game);

function base(){rect(0,0,800,500,"#071020");for(let i=0;i<30;i++)circ((i*139)%800,(i*79)%500,1,"#203653")}
function move(p,s=5){p.x+=((keys.ArrowRight||keys.d)?s:0)-((keys.ArrowLeft||keys.a)?s:0);p.y+=((keys.ArrowDown||keys.s)?s:0)-((keys.ArrowUp||keys.w)?s:0);p.x=Math.max(12,Math.min(788,p.x));p.y=Math.max(12,Math.min(488,p.y))}
function draw(){
let s=state;s.t++;base();
if(game===0){if(++s.tick%8===0){let h={x:s.snake[0].x+s.dir.x,y:s.snake[0].y+s.dir.y};if(h.x<0||h.x>=20||h.y<0||h.y>=12||s.snake.some(p=>p.x===h.x&&p.y===h.y)){end("The snake crashed.");return}s.snake.unshift(h);if(h.x===s.food.x&&h.y===s.food.y){setScore(score+10);s.food={x:Math.floor(rand(0,20)),y:Math.floor(rand(0,12))}}else s.snake.pop()}s.snake.forEach((p,i)=>rect(p.x*40+2,p.y*40+2,36,36,i?"#268bcb":"#63e6ff"));circ(s.food.x*40+20,s.food.y*40+20,13,"#ff5577")}
else if(game===1||game===15){let p=s.player;p.vy=(p.vy||0)+.3;p.y+=p.vy;if(keys[" "]||pointer.down){p.vy=-6;keys[" "]=false;pointer.down=false}circ(180,p.y,17,"#ffd34e");if(p.y>485||p.y<0){end("You fell!");return}if(s.t%65===0)s.items.push({x:820,y:rand(90,390),passed:false});s.items.forEach(o=>{o.x-=4;rect(o.x,o.y-95,24,170,"#40bd7b");rect(o.x,o.y+85,24,170,"#40bd7b");if(Math.abs(o.x-180)<23&&Math.abs(p.y-o.y)>70){end("You hit an obstacle.");}if(o.x<180&&!o.passed){o.passed=true;setScore(score+1)}});if(game===15){p.y=245+Math.sin(s.t/13)*110;circ(180,p.y,17,"#79f3a6")}}
else if([2,20,21,22].includes(game)){let p=s.player;move(p,6);rect(0,420,800,80,"#263c4d");for(let x=0;x<800;x+=80)rect(x+(s.t*5%80),450,35,5,"#e6eaf0");rect(p.x-17,p.y-27,34,54,"#40baff");if(s.t%35===0)s.items.push({x:rand(45,755),y:-25});s.items.forEach(o=>{o.y+=5;rect(o.x-14,o.y-20,28,40,"#ff6579");if(Math.abs(o.x-p.x)<28&&Math.abs(o.y-p.y)<34){if(game===20){setScore(score+1);o.y=600}else end("Crash! Try again.")}})}
else if([3,4,5,14,18,19,23,25,29].includes(game)){let p=s.player;move(p,6);circ(p.x,p.y,17,"#4ac8ff");if(s.t%50===0)s.items.push({x:rand(35,765),y:rand(35,465),r:rand(12,20),vx:rand(-2,2),vy:rand(-2,2)});s.items.forEach(o=>{o.x+=o.vx||0;o.y+=o.vy||0;if(o.x<15||o.x>785)o.vx*=-1;if(o.y<15||o.y>485)o.vy*=-1;circ(o.x,o.y,o.r||16,game===14?"#ff4e83":"#ffbd55");if(pointer.down&&Math.hypot(pointer.x-o.x,pointer.y-o.y)<(o.r||16)+12){o.hit=true;setScore(score+10)}});s.items=s.items.filter(o=>!o.hit);if(game===5){s.items.forEach(o=>{if(Math.hypot(o.x-p.x,o.y-p.y)<25)end("A zombie caught you!")})}if(game===4||game===23||game===25){if(keys[" "]||pointer.down){circ(p.x+22,p.y-12,7,"#fff078");s.items.forEach(o=>{if(Math.hypot(o.x-p.x-22,o.y-p.y+12)<25){o.hit=true;setScore(score+10)}});keys[" "]=false}}if(game===3){rect(0,465,800,35,"#24523b");if(s.t%80===0)setScore(score+1)}if(s.t>900)end("Time is up!")}
else if(game===6){let b=s.ball;s.paddle=Math.max(0,Math.min(410,pointer.y-45));rect(35,s.paddle,15,90,"#58dcff");circ(b.x,b.y,10,"#ffdf70");b.x+=b.vx;b.y+=b.vy;if(b.y<10||b.y>490)b.vy*=-1;if(b.x>790)b.vx*=-1;if(b.x<50&&b.y>s.paddle&&b.y<s.paddle+90){b.vx=Math.abs(b.vx);setScore(score+1)}if(b.x<0)end("You missed the ball.")}
else if([7,24].includes(game)){let b=s.ball;s.paddle=Math.max(0,Math.min(680,pointer.x-60));rect(s.paddle,462,120,14,"#59d9ff");circ(b.x,b.y,9,"#ffdf70");b.x+=b.vx;b.y+=b.vy;if(b.x<8||b.x>792)b.vx*=-1;if(b.y<8)b.vy*=-1;if(b.y>450&&b.x>s.paddle&&b.x<s.paddle+120)b.vy=-Math.abs(b.vy);s.bricks.forEach(o=>{if(o.on){rect(o.x,o.y,82,22,"#a16cff");if(b.x>o.x&&b.x<o.x+82&&b.y>o.y&&b.y<o.y+22){o.on=false;b.vy*=-1;setScore(score+5)}}});if(b.y>500)end("Ball lost!");if(s.bricks.every(o=>!o.on))end("All blocks cleared!")}
else if(game===8){for(let i=0;i<9;i++){let x=250+i%3*100,y=90+Math.floor(i/3)*100;rect(x,y,96,96,"#1b3557");txt(s.board[i],x+48,y+64,44,"#65e2ff")}if(pointer.down){let c=Math.floor((pointer.x-250)/100),r=Math.floor((pointer.y-90)/100),k=r*3+c;if(c>=0&&c<3&&r>=0&&r<3&&!s.board[k]){s.board[k]="X";if(win(s.board,"X")){setScore(score+1);end("You won!")}else{let e=s.board.map((v,i)=>v?-1:i).filter(i=>i>=0);if(e.length){s.board[e[Math.floor(Math.random()*e.length)]]="O";if(win(s.board,"O"))end("Computer wins!");else if(!s.board.includes(""))end("It's a draw!")}}}pointer.down=false}}
else if(game===9){s.board.forEach((v,i)=>{let x=176+i%4*113,y=85+Math.floor(i/4)*95;rect(x,y,106,88,v?"#246c99":"#192d4b");if(v)txt(v,x+53,y+56,27)});}
else if(game===10){s.cards.forEach((v,i)=>{let x=185+i%4*110,y=75+Math.floor(i/4)*100;rect(x,y,100,90,s.done.includes(i)?"#205c55":"#1c3557");txt(s.open.includes(i)||s.done.includes(i)?["🍎","🍋","🍇","🍒","⭐","🐟","🎲","💎"][v]:"?",x+50,y+59,30)});if(pointer.down){let c=Math.floor((pointer.x-185)/110),r=Math.floor((pointer.y-75)/100),k=r*4+c;if(c>=0&&c<4&&r>=0&&r<4&&!s.open.includes(k)&&!s.done.includes(k)){s.open.push(k);if(s.open.length===2){if(s.cards[s.open[0]]===s.cards[s.open[1]]){s.done.push(...s.open);setScore(score+10);s.open=[]}else setTimeout(()=>s.open=[],650)}}pointer.down=false}if(s.done.length===16)end("Every pair matched!")}
else if(game===11){for(let i=0;i<25;i++){let x=250+i%5*62,y=90+Math.floor(i/5)*62;rect(x,y,57,57,s.reveal.includes(i)?"#24445f":"#31577c");if(s.reveal.includes(i))txt(s.mines.includes(i)?"💣":"✓",x+28,y+39,22)}if(pointer.down){let c=Math.floor((pointer.x-250)/62),r=Math.floor((pointer.y-90)/62),k=r*5+c;if(c>=0&&c<5&&r>=0&&r<5&&!s.reveal.includes(k)){s.reveal.push(k);if(s.mines.includes(k))end("Mine! Game over.");else setScore(score+2)}pointer.down=false}}
else if(game===12||game===13){for(let i=0;i<64;i++){let x=180+i%8*55,y=30+Math.floor(i/8)*55;rect(x,y,53,53,(Math.floor(i/8)+i)%2?"#31577c":"#d9e7ef");if(s.pieces[i])txt(s.pieces[i],x+26,y+37,25,s.pieces[i]==="●"?"#17263a":"#fff")}if(pointer.down){let c=Math.floor((pointer.x-180)/55),r=Math.floor((pointer.y-30)/55),k=r*8+c;if(c>=0&&c<8&&r>=0&&r<8){if(s.selected>=0&&s.selected!==k){s.pieces[k]=s.pieces[s.selected];s.pieces[s.selected]="";s.selected=-1;setScore(score+1)}else if(s.pieces[k])s.selected=k}pointer.down=false}}
else if(game===16){let p=s.player;move(p,5);circ(p.x,p.y,14,"#ffdc4f");s.items.forEach(o=>{circ(o.x,o.y,5,"#e9e7a3");if(Math.hypot(p.x-o.x,p.y-o.y)<18){o.x=rand(20,780);o.y=rand(20,480);setScore(score+1)}})}
else if(game===17){if(s.t%75===0)s.enemies.push({x:0,y:250,hp:3});s.enemies.forEach(e=>{e.x+=1.5;circ(e.x,e.y,12,"#ff6c70");s.towers.forEach(t=>{if(Math.hypot(t.x-e.x,t.y-e.y)<130&&s.t%12===0)e.hp--})});s.enemies=s.enemies.filter(e=>{if(e.hp<=0){setScore(score+10);return false}if(e.x>800){end("An enemy got through!");return false}return true});s.towers.forEach(t=>circ(t.x,t.y,12,"#63d9ff"));if(pointer.down){s.towers.push({x:pointer.x,y:pointer.y});pointer.down=false}}
else if(game===18||game===19||game===23||game===25){let x=400+Math.sin(s.t/25)*260,y=130+Math.cos(s.t/31)*45;circ(x,y,game===18?25:30,game===19?"#f5a64c":"#ff6b77");if(pointer.down){if(Math.hypot(pointer.x-x,pointer.y-y)<45)setScore(score+10);pointer.down=false}}
else if(game===20){let x=400+Math.sin(s.t/20)*110;rect(300,390,200,12,"#b4c4d6");rect(x-35,345,70,45,"#ffb34f");rect(pointer.x<400?320:460,300,20,90,"#ff667c");if(pointer.down){setScore(score+5);pointer.down=false}}
else if(game===26){s.tiles.forEach((v,i)=>{let x=250+i%4*75,y=100+Math.floor(i/4)*75;rect(x,y,68,68,v?"#285b86":"#172b48");txt(v||"",x+34,y+45,22)});if(s.tiles[15]===0)end("Puzzle complete!")}
else if(game===27){for(let i=0;i<100;i++){let x=200+i%10*40,y=50+Math.floor(i/10)*40;rect(x,y,38,38,s.walls.has(i)?"#35506b":"#142944")}circ(200+s.pos%10*40+19,50+Math.floor(s.pos/10)*40+19,13,"#ffe16b");rect(200+8*40+8,50+8*40+8,22,22,"#3de3a4");if(s.pos===88)end("You escaped the maze!")}
else if(game===28){for(let i=0;i<40;i++){let x=100+i%8*75,y=70+Math.floor(i/8)*70;rect(x,y,65,60,"#294568")}s.bombs.forEach(b=>{circ(b.x,b.y,18,"#ffb84d");if(s.t-b.t>100){s.bombs=s.bombs.filter(x=>x!==b);setScore(score+2)}});if(keys[" "]){s.bombs.push({x:s.player.x,y:s.player.y,t:s.t});keys[" "]=false}move(s.player);circ(s.player.x,s.player.y,13,"#69e1ff")}
else if(game===29){let fishX=100+(s.t*4)%600;rect(395,40,10,280,"#b7c9d9");circ(fishX,350,17,"#ffb34d");circ(400,320,8,"#f1e6b7");if((keys[" "]||pointer.down)&&Math.abs(fishX-400)<55){setScore(score+10);s.t=0;keys[" "]=false;pointer.down=false}}
}
function win(b,m){return [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(a=>a.every(i=>b[i]===m))}
function loop(t){if(!active)return;draw();raf=requestAnimationFrame(loop)}
function pos(e){let r=canvas.getBoundingClientRect();pointer.x=(e.clientX-r.left)*800/r.width;pointer.y=(e.clientY-r.top)*500/r.height}
canvas.addEventListener("pointerdown",e=>{pos(e);pointer.down=true;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener("pointermove",e=>{pos(e);if(e.buttons)pointer.down=true});
canvas.addEventListener("pointerup",()=>{});
window.addEventListener("keydown",e=>{if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();keys[e.key]=true;if(game===0){let d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(d&&!(d[0]===-state.dir.x&&d[1]===-state.dir.y))state.dir={x:d[0],y:d[1]}}
if(game===9&&["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key))slide2048(e.key);
if(game===27){let d={ArrowUp:-10,ArrowDown:10,ArrowLeft:-1,ArrowRight:1}[e.key],n=state.pos+d;if(d!==undefined&&n>=0&&n<100&&!state.walls.has(n)){state.pos=n;setScore(score+1)}}
});
window.addEventListener("keyup",e=>keys[e.key]=false);
document.querySelectorAll("[data-key]").forEach(b=>{let k=b.dataset.key;b.addEventListener("pointerdown",e=>{e.preventDefault();keys[k]=true;if(game===0){let d={"ArrowUp":[0,-1],"ArrowDown":[0,1],"ArrowLeft":[-1,0],"ArrowRight":[1,0]}[k];if(d&&!(d[0]===-state.dir.x&&d[1]===-state.dir.y))state.dir={x:d[0],y:d[1]}}if(game===27){let d={"ArrowUp":-10,"ArrowDown":10,"ArrowLeft":-1,"ArrowRight":1}[k],n=state.pos+d;if(d!==undefined&&n>=0&&n<100&&!state.walls.has(n))state.pos=n}if(game===9)slide2048(k)});b.addEventListener("pointerup",()=>keys[k]=false);b.addEventListener("pointerleave",()=>keys[k]=false)});
function slide2048(key){let b=state.board,changed=false;for(let n=0;n<4;n++){let ids=[];for(let j=0;j<4;j++)ids.push(key==="ArrowLeft"||key==="ArrowRight"?n*4+(key==="ArrowLeft"?j:3-j):(key==="ArrowUp"?j*4+n:(3-j)*4+n));let a=ids.map(i=>b[i]).filter(Boolean),out=[];for(let j=0;j<a.length;j++){if(a[j]===a[j+1]){out.push(a[j]*2);setScore(score+a[j]*2);j++}else out.push(a[j])}while(out.length<4)out.push(0);ids.forEach((i,j)=>{if(b[i]!==out[j])changed=true;b[i]=out[j]})}if(changed)spawn2048();if(b.includes(2048))end("You made 2048!")}
</script>
